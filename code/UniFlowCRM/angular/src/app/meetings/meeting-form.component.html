<div class="card">
  <div class="card-header">
    <div class="d-flex justify-content-end">
      <app-return-btn></app-return-btn>
    </div>
    <h5 class="display-6 fw-bold">
      {{ (id ? '::Client:Action:Update' : '::Client:Action:Create') | abpLocalization }}
      <span class="text-brand">
      {{ form.get('name')?.value }}

      </span>
    </h5>
  </div>

  <div class="card-body">

    <form [formGroup]="form" (ngSubmit)="save()">

      <div class="row">

        <!-- LEFT -->
        <div class="col-md-6">

          <div class="form-group mb-3">
            <label for="meeting-name">
              {{ '::Name' | abpLocalization }}
            </label>
            <span> * </span>

            <input
              id="meeting-name"
              type="text"
              class="form-control"
              formControlName="name"
              autofocus
            />
          </div>

          <div class="form-group mb-3">
            <label for="meeting-location">
              {{ '::Location' | abpLocalization }}
            </label>

            <input
              id="meeting-location"
              type="text"
              class="form-control"
              formControlName="location"
            />
          </div>

          <div class="form-group mb-3">
            <label for="meeting-start">
              {{ '::StartTime' | abpLocalization }}
            </label>

            <input
              id="meeting-start"
              type="datetime-local"
              class="form-control"
              formControlName="startTime"
            />
          </div>
          <div class="form-group mb-3">
            <label for="meeting-end">
              {{ '::EndTime' | abpLocalization }}
            </label>

            <input
              id="meeting-end"
              type="datetime-local"
              class="form-control"
              formControlName="endTime"
            />
          </div>
            <div class="form-group mb-3">
              <label for="meeting-status">
                {{ '::Status' | abpLocalization }}
              </label>

              <select
                id="meeting-status"
                class="form-control"
                formControlName="status"
              >
                <option [value]="null" disabled selected>
                  {{ '::SelectValue' | abpLocalization }}
                </option>

                @for (status of meetingStatuses; track status.value) {
                  <option [value]="status.value">
                    {{ '::Meeting:Status:' + status.value | abpLocalization }}
                  </option>
                }
              </select>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="col-md-6">



          <div class="mb-3">
            <users-lookup formControlName="ownerID"></users-lookup>
          </div>

          <div class="mb-3">
            <leads-lookup formControlName="leadID"></leads-lookup>
          </div>

          <div class="mb-3">
            <accounts-lookup formControlName="accountID"></accounts-lookup>
          </div>

          <div class="mb-3">
            <contacts-lookup formControlName="contactID"></contacts-lookup>
          </div>

          <div class="mb-3">
            <opportunities-lookup formControlName="opportunityID"></opportunities-lookup>
          </div>

        </div>

      </div>

      <!-- STATUS -->
      <div class="row">



      </div>

      <!-- DESCRIPTION -->
      <div class="form-group mb-3">
        <label for="meeting-description">
          {{ '::Description' | abpLocalization }}
        </label>

        <textarea
          id="meeting-description"
          class="form-control"
          formControlName="description"
          rows="3"
        ></textarea>
      </div>

      <!-- ACTIONS -->
      <div class="text-end">

        <button
          type="button"
          class="btn btn-outline-danger me-2"
          (click)="cancel()"
        >
          {{ '::Cancel' | abpLocalization }}
        </button>

        <button class="btn btn-brand">
          <i class="fa fa-check me-1"></i>
          {{ '::Save' | abpLocalization }}
        </button>

      </div>

    </form>

  </div>
</div>
