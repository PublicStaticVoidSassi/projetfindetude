
  <p class="title">Vos Opportunités</p>
  <div class="row">
    <div class="col">
      <div class="d-flex flex-column justify-content-around">
        <div class="card border-0 shadow-sm kpi-card">
          <div class="card-body px-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <div>
                <h6 class="text-muted text-uppercase fs-7 fw-semibold mb-1" style="letter-spacing: 0.5px;">revenu dinar</h6>
                <h2 class="fw-bold mb-0">{{income.dzdincome}},00 DZD</h2>
              </div>
              <div class="bg-success-subtle text-white p-3 rounded-3 fs-3 lh-1">
                <i class="fas ">DA</i>
              </div>
            </div>
          </div>
        </div>
        <div class="card border-0 shadow-sm kpi-card">
          <div class="card-body px-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <div>
                <h6 class="text-muted text-uppercase fs-7 fw-semibold mb-1" style="letter-spacing: 0.5px;">revenu euro</h6>
                <h2 class="fw-bold mb-0">{{income.eurincome}},00 €</h2>
              </div>
              <div class="bg-success-subtle text-white p-3 rounded-3 fs-3 lh-1">
                <i class="fas fa-euro"></i>
              </div>
            </div>
          </div>
        </div>
        <div class="card border-0 shadow-sm kpi-card">
          <div class="card-body px-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <div>
                <h6 class="text-muted text-uppercase fs-7 fw-semibold mb-1" style="letter-spacing: 0.5px;">revenu dollar</h6>
                <h2 class="fw-bold mb-0">{{income.usdincome}},00 $</h2>
              </div>
              <div class="bg-success-subtle text-white p-3 rounded-3 fs-3 lh-1">
                <i class="fas fa-dollar"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-5">
      <div class="card kpi-card">
        <p-chart type="pie" [data]="opportunitydata" [options]="opsOptions" />
      </div>
    </div>
  </div>
