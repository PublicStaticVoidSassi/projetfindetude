
  <p class="display-4 text-brand mb-2">Vos Contacts</p>
  <div class="row">
    <div class="col-5">
      <div class="card kpi-card">
        <p-chart type="pie" [data]="contactdata" [options]="conOptions" />
      </div>
    </div>
    <div class="col d-flex justify-content-around flex-column">
      <div class="card border-0 shadow-sm kpi-card">
        <div class="card-body px-4">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
              <h6 class="text-muted text-uppercase fs-7 fw-semibold mb-1" style="letter-spacing: 0.5px;">Contacts Totales</h6>
              <h2 class="fw-bold mb-0">{{dashboard.totalcontacts}}</h2>
            </div>
            <div class="bg-primary-subtle text-white p-3 rounded-3 fs-3 lh-1">
              <i class="fas fa-id-card"></i>
            </div>
          </div>
        </div>
      </div>
      <div class="card border-0 shadow-sm kpi-card">
        <div class="card-body px-4">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
              <h6 class="text-muted text-uppercase fs-7 fw-semibold mb-1" style="letter-spacing: 0.5px;">Contacts Active</h6>
              <h2 class="fw-bold mb-0">{{dashboard.activecontacts}}</h2>
            </div>
            <div class="bg-primary-subtle text-white p-3 rounded-3 fs-3 lh-1">
              <i class="fas fa-heart"></i>
            </div>
          </div>
        </div>
      </div>
      <div class="card border-0 shadow-sm kpi-card">
        <div class="card-body px-4">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
              <h6 class="text-muted text-uppercase fs-7 fw-semibold mb-1" style="letter-spacing: 0.5px;">Contacts Inactive</h6>
              <h2 class="fw-bold mb-0">{{dashboard.inactivecontacts}}</h2>
            </div>
            <div class="bg-primary-subtle text-white p-3 rounded-3 fs-3 lh-1">
              <i class="fas fa-skull"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
