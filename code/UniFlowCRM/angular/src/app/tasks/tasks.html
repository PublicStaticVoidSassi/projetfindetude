<div class="card">

  <div class="card-header">
    <div class="row align-items-center">

      <div class="col-md-6">
        <h5 class="display-6 fw-bold">
          {{ '::Menu:Tasks' | abpLocalization }}
        </h5>
      </div>

      <div class="col-md-6 text-end">
        <button
          *abpPermission='"UniFlowCRM.Task.Create"'
          class="btn btn-brand btn-sm"
          type="button"
          (click)="create()"
        >
          <i class="fa fa-plus me-1"></i>

          <span>
            {{ '::Object:Add' | abpLocalization }}
          </span>
        </button>
      </div>

    </div>
  </div>

  <div class="card-body">
    <div class="row">
      <div class="col-4">
        <input type="text" class="form-control" (ngModelChange)="search()"  [(ngModel)]="searchName" [placeholder]="'::Task'|abpLocalization"/>
      </div>
    </div>
    <ngx-datatable
      [rows]="items.items"
      [count]="items.totalCount"
      [list]="list"
      default
    >

      <!-- ACTIONS -->
      <ngx-datatable-column
        [name]="'::Actions' | abpLocalization"
        [maxWidth]="150"
        [sortable]="false"
      >
        <ng-template
          let-row="row"
          ngx-datatable-cell-template
        >

          <div
            ngbDropdown
            container="body"
            class="d-inline-block"
          >

            <button
              class="btn btn-brand btn-sm dropdown-toggle"
              ngbDropdownToggle
            >
              <i class="fa fa-cog me-1"></i>

              {{ '::Actions' | abpLocalization }}
            </button>

            <div ngbDropdownMenu>

              <button
                ngbDropdownItem
                (click)="openDetails(row.id)"
              >
                {{ '::Details' | abpLocalization }}
              </button>

              <button
                ngbDropdownItem
                *abpPermission='"UniFlowCRM.Task.Edit"'
                (click)="edit(row.id)"
              >
                {{ '::Edit' | abpLocalization }}
              </button>

              <button
                ngbDropdownItem
                *abpPermission='"UniFlowCRM.Task.Delete"'
                (click)="delete(row.id)"
              >
                {{ '::Delete' | abpLocalization }}
              </button>

            </div>
          </div>

        </ng-template>
      </ngx-datatable-column>

      <!-- NAME -->
      <ngx-datatable-column
        [name]="'::Name' | abpLocalization"
        prop="name"
      >
      </ngx-datatable-column>

      <!-- STATUS -->
      <ngx-datatable-column
        [name]="'::Status' | abpLocalization"
        prop="status"
      >
        <ng-template
          let-row="row"
          ngx-datatable-cell-template
        >
          {{ '::Task:Status:' + row.status | abpLocalization }}
        </ng-template>
      </ngx-datatable-column>

      <!-- PRIORITY -->
      <ngx-datatable-column
        [name]="'::Priority' | abpLocalization"
        prop="priority"
      >
        <ng-template
          let-row="row"
          ngx-datatable-cell-template
        >
          {{ '::Task:Priority:' + row.priority | abpLocalization }}
        </ng-template>
      </ngx-datatable-column>

      <!-- OWNER -->
      <ngx-datatable-column
        [name]="'::Owner' | abpLocalization"
      >
        <ng-template
          let-row="row"
          ngx-datatable-cell-template
        >
          {{ row.owner?.userName || '-' }}
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column
        [name]="'::StartTime' | abpLocalization"
        prop="startTime"
      >
        <ng-template
          let-row="row"
          ngx-datatable-cell-template
        >
          {{ row.startTime | date:'short' }}
        </ng-template>
      </ngx-datatable-column>

      <!-- END -->

        [name]="'::EndTime' | abpLocalization"

        <ng-template
