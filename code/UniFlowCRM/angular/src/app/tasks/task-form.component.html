<div class="card">
  <div class="card-header">
    <h5 class="card-title">
      {{ (id ? '::Edit' : '::Nouvelle Tache') | abpLocalization }}
    </h5>
  </div>

  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="row">
        <div class="col-md-6">
          <div class="form-group mb-3">
            <label for="task-name">{{ '::Name' | abpLocalization }}</label><span> * </span>
            <input id="task-name" type="text" class="form-control" formControlName="name" autofocus />
          </div>

          <div class="form-group mb-3">
            <label for="task-start">commence à</label>
            <input id="task-start" type="datetime-local" class="form-control" formControlName="startTime" />
          </div>
          <div class="form-group mb-3">
            <label for="task-end">se termine autour</label>
            <input id="task-end" type="datetime-local" class="form-control" formControlName="endTime" />
          </div>
          <!--          <div class="form-group mb-3">-->
          <!--            <label for="task-completed">{{ '::CompletedAt' | abpLocalization }}</label>-->
          <!--            <input-->
          <!--              id="task-completed"-->
          <!--              type="datetime-local"-->
          <!--              class="form-control"-->
          <!--              formControlName="completedAt" />-->
          <!--          </div>-->
          <div class="col">
            <div class="form-group mb-3">
              <label for="task-status">État</label>
              <select id="task-status" class="form-control" formControlName="status">
                @for (status of taskStatuses; track status.value) {
                <option [value]="status.value">
                  {{ '::Task:Status:' + status.value | abpLocalization }}
                </option>
                }
              </select>
            </div>
          </div>

          <div class="col">
            <div class="form-group mb-3">
              <label for="task-priority">priorité</label>
              <select id="task-priority" class="form-control" formControlName="priority">

                @for (priority of taskPriorities; track priority.value) {
                <option [value]="priority.value">
                  {{ '::Task:Priority:' + priority.value | abpLocalization }}
                </option>
                }
              </select>
            </div>
          </div>




        </div>

        <div class="col-md-6">

          <div class="mb-3">
            <users-lookup formControlName="ownerID"></users-lookup>
          </div>
          <div class="mb-3">
            <accounts-lookup [disabled]="
  (form.get('leadID')?.value && form.get('leadID')?.value !== 'null')||
  (form.get('contactID')?.value && form.get('contactID')?.value !== 'null')||
  (form.get('opportunityID')?.value && form.get('opportunityID')?.value !== 'null')
  " formControlName="accountID"></accounts-lookup>
          </div>

          <div class="mb-3">
            <contacts-lookup [disabled]="
  (form.get('accountID')?.value && form.get('accountID')?.value !== 'null')||
  (form.get('leadID')?.value && form.get('leadID')?.value !== 'null')||
  (form.get('opportunityID')?.value && form.get('opportunityID')?.value !== 'null')
  " formControlName="contactID"></contacts-lookup>
          </div>

          <div class="mb-3">
            <opportunities-lookup [disabled]="
  (form.get('accountID')?.value && form.get('accountID')?.value !== 'null')||
  (form.get('leadID')?.value && form.get('leadID')?.value !== 'null')||
  (form.get('contactID')?.value && form.get('contactID')?.value !== 'null')
  " formControlName="opportunityID"></opportunities-lookup>
          </div>
          <div class="mb-3">
            <leads-lookup [disabled]="
  (form.get('accountID')?.value && form.get('accountID')?.value !== 'null')||
  (form.get('contactID')?.value && form.get('contactID')?.value !== 'null')||
  (form.get('opportunityID')?.value && form.get('opportunityID')?.value !== 'null')
  " formControlName="leadID">
            </leads-lookup>
          </div>
        </div>
      </div>

      <div class="row">
      </div>

      <div class="form-group mb-3">
        <label for="task-description">{{ '::Description' | abpLocalization }}</label>
        <textarea id="task-description" class="form-control" formControlName="description" rows="3"></textarea>
      </div>

      <!--      <leads-lookup formControlName="leadId"></leads-lookup>-->
      <!--      <accounts-lookup formControlName="accountId"></accounts-lookup>-->
      <!--      <contacts-lookup formControlName="contactId"></contacts-lookup>-->
      <!--      <opportunities-lookup formControlName="opportunityId"></opportunities-lookup>-->
      <!--      <users-lookup formControlName="owner"></users-lookup>-->

      <div class="text-end">
        <button type="button" class="btn btn-sm btn-outline-danger me-2" (click)="cancel()">
          {{ '::Cancel' | abpLocalization }}
        </button>

        <button class="btn btn-brand btn-sm">
          <i class="fa fa-check me-1"></i>
          {{ '::Save' | abpLocalization }}
        </button>
      </div>
    </form>
  </div>
</div>
