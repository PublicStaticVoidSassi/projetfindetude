<div class="card">
  <div class="card-header">
    <h5 class="card-title">{{ (id ? '::Edit' : '::NewTask') | abpLocalization }}</h5>
  </div>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-group mb-3">
        <label for="title">{{ '::Title' | abpLocalization }}</label><span> * </span>
        <input id="title" type="text" class="form-control" formControlName="title" autofocus />
      </div>

      <div class="form-group mb-3">
        <label for="due-date">{{ '::DueDate' | abpLocalization }}</label>
        <input id="due-date" type="date" class="form-control" formControlName="dueDate" />
      </div>

      <div class="form-group mb-3">
        <label for="description">{{ '::Description' | abpLocalization }}</label>
        <textarea id="description" class="form-control" formControlName="description" rows="5"></textarea>
      </div>
      
      <div class="text-end">
        <button type="button" class="btn btn-secondary me-2" (click)="cancel()">
          {{ '::Cancel' | abpLocalization }}
        </button>
        <button class="btn btn-primary" [disabled]="form.invalid || loading()">
          <i class="fa fa-check me-1"></i>
          {{ '::Save' | abpLocalization }}
        </button>
      </div>
    </form>
  </div>
</div>
