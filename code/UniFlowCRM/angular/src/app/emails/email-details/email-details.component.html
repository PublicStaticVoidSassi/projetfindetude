<div class="card" *ngIf="email()">
  <div class="card-header">
    <div class="row align-items-center">
      <div class="col col-md-6">
        <h5 class="card-title">{{ '::EmailDetails' | abpLocalization }}</h5>
      </div>
      <div class="text-end col col-md-6">
        <button class="btn btn-secondary btn-sm me-2" (click)="goBack()">
          <i class="fa fa-arrow-left me-1"></i>
          {{ '::Back' | abpLocalization }}
        </button>
        <button class="btn btn-primary btn-sm me-2" (click)="edit()">
          <i class="fa fa-edit me-1"></i>
          {{ '::Edit' | abpLocalization }}
        </button>
        <button class="btn btn-danger btn-sm" (click)="delete()">
          <i class="fa fa-trash me-1"></i>
          {{ '::Delete' | abpLocalization }}
        </button>
      </div>
    </div>
  </div>
  <div class="card-body">
    <div class="row">
      <div class="col-12 mb-3">
        <label class="text-muted small d-block">{{ '::To' | abpLocalization }}</label>
        <p class="mt-1"><strong>{{ email().toAddress }}</strong></p>
        
        <label class="text-muted small d-block">{{ '::Subject' | abpLocalization }}</label>
        <p class="mt-1 lead">{{ email().subject }}</p>
        <hr>
        
        <label class="text-muted small d-block">{{ '::Body' | abpLocalization }}</label>
        <div class="mt-2 p-3 bg-light border rounded" style="white-space: pre-wrap;">{{ email().body }}</div>
      </div>
    </div>
  </div>
</div>
