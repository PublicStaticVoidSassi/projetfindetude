<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">{{ '::Menu:Emails' | abpLocalization }}</h5>
      </div>
      <div class="text-end col col-md-6">
        <button class="btn btn-brand btn-sm me-2" type="button" (click)="create()">
          <i class="fa fa-plus me-1"></i>
          <span>{{ '::Object:Add' | abpLocalization }}</span>
        </button>
<!--        <app-return-btn></app-return-btn>-->
      </div>
    </div>
  </div>
  <div class="card-body">
    <ngx-datatable [rows]="items.items" [count]="items.totalCount" [list]="list" default>
      <ngx-datatable-column
        [name]="'::Actions' | abpLocalization"
        [maxWidth]="150"
        [sortable]="false"
      >
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button
              class="btn btn-brand btn-sm dropdown-toggle"
              data-toggle="dropdown"
              aria-haspopup="true"
              ngbDropdownToggle
            >
              <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
            </button>
            <div ngbDropdownMenu>
              <button ngbDropdownItem (click)="openDetails(row.id)">
                {{ '::Details' | abpLocalization }}
              </button>
              <button ngbDropdownItem (click)="edit(row.id)">
                {{ '::Edit' | abpLocalization }}
              </button>
              <button ngbDropdownItem (click)="delete(row.id)">
                {{ '::Delete' | abpLocalization }}
              </button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::Email:Subject' | abpLocalization" prop="subject">
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::Email:Status' | abpLocalization" prop="status">
        <ng-template ngx-datatable-cell-template let-row="row">
          {{'::Email:Status:'+row.status | abpLocalization}}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::Email:To' | abpLocalization" prop="to">

      </ngx-datatable-column>
      <ngx-datatable-column [name]="'Client::AssignedTo' | abpLocalization" prop="ownerID">
        <ng-template ngx-datatable-cell-template let-row="row">
          {{row.owner?.userName}}
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>
