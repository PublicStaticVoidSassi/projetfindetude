<div class="card">

  <div class="card-header">
    <div class="row align-items-center">

      <div class="col-md-6">
        <h5 class="card-title mb-0">
          {{ '::Menu:Calls' | abpLocalization }}
        </h5>
      </div>

      <div class="col-md-6 text-end">
        <button
          class="btn btn-primary"
          type="button"
          (click)="create()"
        >
          <i class="fa fa-plus me-1"></i>

          <span>
            {{ '::NewCall' | abpLocalization }}
          </span>
        </button>
      </div>

    </div>
  </div>

  <div class="card-body">

    <ngx-datatable
      [rows]="items.items"
      [count]="items.totalCount"
      [list]="list"
      default
    >

      <!-- ACTIONS -->
      <ngx-datatable-column
        [name]="'::Actions' | abpLocalization"
        [maxWidth]="150"
        [sortable]="false"
      >
        <ng-template
          let-row="row"
          ngx-datatable-cell-template
        >

          <div
            ngbDropdown
            container="body"
            class="d-inline-block"
          >

            <button
              class="btn btn-primary btn-sm dropdown-toggle"
              ngbDropdownToggle
            >
              <i class="fa fa-cog me-1"></i>

              {{ '::Actions' | abpLocalization }}
            </button>

            <div ngbDropdownMenu>

              <button
                ngbDropdownItem
                (click)="openDetails(row.id)"
              >
                {{ '::Details' | abpLocalization }}
              </button>

              <button
                ngbDropdownItem
                (click)="edit(row.id)"
              >
                {{ '::Edit' | abpLocalization }}
              </button>

              <button
                ngbDropdownItem
                (click)="delete(row.id)"
              >
                {{ '::Delete' | abpLocalization }}
              </button>

            </div>
          </div>

        </ng-template>
      </ngx-datatable-column>

      <!-- NAME -->
      <ngx-datatable-column
        [name]="'::Name' | abpLocalization"
        prop="name"
      >
      </ngx-datatable-column>

      <!-- STATUS -->
      <ngx-datatable-column
        [name]="'::Status' | abpLocalization"
        prop="status"
      >
        <ng-template
          let-row="row"
          ngx-datatable-cell-template
        >
          {{ '::Call:Status:' + row.status | abpLocalization }}
        </ng-template>
      </ngx-datatable-column>

      <!-- DIRECTION -->
      <ngx-datatable-column
        [name]="'::Direction' | abpLocalization"
        prop="direction"
      >
        <ng-template
          let-row="row"
          ngx-datatable-cell-template
        >
          {{ '::Call:Direction:' + row.direction | abpLocalization }}
        </ng-template>
      </ngx-datatable-column>

      <!-- PHONE -->
      <ngx-datatable-column
        [name]="'::PhoneNumber' | abpLocalization"
        prop="phoneNumber"
      >
      </ngx-datatable-column>

      <!-- OWNER -->
      <ngx-datatable-column
        [name]="'::Owner' | abpLocalization"
      >
        <ng-template
          let-row="row"
          ngx-datatable-cell-template
        >
          {{ row.owner?.userName || '-' }}
        </ng-template>
      </ngx-datatable-column>

      <!-- START -->
      <ngx-datatable-column
        [name]="'::StartTime' | abpLocalization"
        prop="startTime"
      >
        <ng-template
          let-row="row"
          ngx-datatable-cell-template
        >
          {{ row.startTime | date:'short' }}
        </ng-template>
      </ngx-datatable-column>

      <!-- END -->
      <ngx-datatable-column
        [name]="'::EndTime' | abpLocalization"
        prop="endTime"
      >
        <ng-template
          let-row="row"
          ngx-datatable-cell-template
        >
          {{ row.endTime | date:'short' }}
        </ng-template>
      </ngx-datatable-column>

      







      

    </ngx-datatable>

  </div>
</div>
