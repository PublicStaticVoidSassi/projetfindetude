<div class="card">
  <div class="card-header">
    <h1>{{ '::Contacts' | abpLocalization }}</h1>
  </div>

  <div class="d-flex justify-content-end px-1">
    <button (click)="create()" class="btn btn-brand btn-sm me-2">
      <i class="fa fa-add"></i>
      {{ '::Object:Add' | abpLocalization }}
    </button>
  </div>

  <div class="card-body">
    <ngx-datatable
      [rows]="contacts.items"
      [count]="contacts.totalCount"
      [list]="List"
      default
    >

      <!-- ACTIONS -->
      <ngx-datatable-column [sortable]="false">
        <ng-template ngx-datatable-cell-template let-row="row">

          <div ngbDropdown container="body" class="d-inline-block">
            <button
              class="btn btn-brand btn-sm dropdown-toggle"
              ngbDropdownToggle
            >
              <i class="fa fa-cog me-1"></i>
              {{ '::Actions' | abpLocalization }}
            </button>

            <div ngbDropdownMenu>

              <button ngbDropdownItem (click)="openDetails(row.id)">
                <i class="fa fa-plus-circle p-1 rounded-5"></i>
                {{ '::Action:Info' | abpLocalization }}
              </button>

              <button ngbDropdownItem (click)="delete(row.id)">
                <i class="fa fa-trash p-1  rounded-5"></i>
                {{ '::Action:Delete' | abpLocalization }}
              </button>

              <button ngbDropdownItem (click)="edit(row.id)">
                <i class="fa fa-pen p-1  rounded-5"></i>
                {{ '::Action:Edit' | abpLocalization }}
              </button>

            </div>
          </div>

        </ng-template>
      </ngx-datatable-column>

      <!-- NAME -->
      <ngx-datatable-column
        [name]="'::Contact:FirstName' | abpLocalization"
        prop="firstName">
      </ngx-datatable-column>

      <ngx-datatable-column
        [name]="'::Contact:LastName' | abpLocalization"
        prop="lastName">
      </ngx-datatable-column>

      <!-- EMAIL -->
      <ngx-datatable-column
        [name]="'::Contact:Email' | abpLocalization"
        prop="email">
      </ngx-datatable-column>

      <!-- PHONE -->
      <ngx-datatable-column
        [name]="'::Contact:Phone' | abpLocalization"
        prop="phone">
      </ngx-datatable-column>

      <!-- Assigned to-->
      <ngx-datatable-column
        [name]="'::Client:AssignedTo' | abpLocalization"
        prop="UserID" minWidth="200">
        <ng-template ngx-datatable-cell-template let-row="row">
          {{'@'+row.owner?.userName}}
        </ng-template>
      </ngx-datatable-column>
      <!-- ACCOUNT -->
      <ngx-datatable-column
        [name]="'::Contact:Account' | abpLocalization"
        prop="AccountID">

        <ng-template ngx-datatable-cell-template let-row="row">
          <a class="text-brand" [routerLink]='["/Accounts",row.account?.id]'>
            {{ row.account?.name }}
          </a>
        </ng-template>

      </ngx-datatable-column>

      <!-- LEAD -->
      <ngx-datatable-column
        [name]="'::Contact:Lead' | abpLocalization"
        prop="leadID">

        <ng-template ngx-datatable-cell-template let-row="row">
          @if(row.lead){<a class="text-brand" [routerLink]="['/Lead']">

          {{ row.lead?.firstName + ' ' + row.lead?.lastName}}
          </a>}
        </ng-template>

      </ngx-datatable-column>

      <!-- STATUS -->
      <ngx-datatable-column
        [name]="'::Contact:Status' | abpLocalization"
        prop="status">

        <ng-template ngx-datatable-cell-template let-row="row">
          {{ '::Contact:Status:'+row.status|abpLocalization}}
        </ng-template>

      </ngx-datatable-column>

      <!-- SOURCE -->
      <ngx-datatable-column
        [name]="'::Contact:Source' | abpLocalization"
        prop="source">

        <ng-template ngx-datatable-cell-template let-row="row">
          {{ "::Contact:Source:"+row.source|abpLocalization}}
        </ng-template>

      </ngx-datatable-column>

    </ngx-datatable>
  </div>
</div>
