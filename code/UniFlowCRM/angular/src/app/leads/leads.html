<div class="card">
    <div class="card-header ">
      <h1 class="title">{{ '::Leads' | abpLocalization }}</h1>
    </div>



    <div class="card-body">
      <div class="d-flex justify-content-between mb-3">

          <input type="text" class="form-control w-50" (ngModelChange)="search()"  [(ngModel)]="searchName" placeholder="rechercher"/>
        <button *abpPermission='"UniFlowCRM.Lead.Create"' (click)="create()" class="btn btn-brand btn-sm">
          <i class="fa fa-add"></i>
          <!--        {{ '::Object:Add' | abpLocalization }}-->
          Ajouter un Prospect
        </button>
      </div>
      <ngx-datatable
        [rows]="leads.items"
        [count]="leads.totalCount"
        [list]="List"
        default
      >


        <ngx-datatable-column [sortable]="false">
          <ng-template ngx-datatable-cell-template let-row="row">
            <div ngbDropdown container="body" class="d-inline-block">
              <button
                class="btn btn-brand btn-sm dropdown-toggle"
                data-toggle="dropdown"
                aria-haspopup="true"
                ngbDropdownToggle
              >
                <i class="fa fa-cog me-1"></i>
                {{ '::Actions' | abpLocalization }}
              </button>

              <div ngbDropdownMenu>


                <button *abpPermission='"UniFlowCRM.Lead.Delete"' ngbDropdownItem (click)="delete(row.id)" >
                  <i class="fa fa-trash p-1  rounded-5"></i>
                  {{ '::Action:Delete' | abpLocalization }}
                </button>
                @if(row.status !== LeadStatus.Converted){
                <button *abpPermission='"UniFlowCRM.Lead.Edit"' ngbDropdownItem (click)="edit(row.id)">
                  <i class="fa fa-pen p-1   rounded-5"></i>
                  {{ '::Action:Edit' | abpLocalization }}
                </button>
                }
                <button ngbDropdownItem (click)="openDetails(row.id)">
                  <i class="fa fa-plus-circle p-1   rounded-5"></i>
                  {{ '::Action:Info' | abpLocalization }}
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column
          [name]="'::Lead:FirstName' | abpLocalization"
          prop="firstName">
        </ngx-datatable-column>

        <ngx-datatable-column
          [name]="'::Lead:LastName' | abpLocalization"
          prop="lastName">
        </ngx-datatable-column>
        <ngx-datatable-column
          [name]="'::Client:AssignedTo' | abpLocalization"
          prop="UserID" minWidth="200">
          <ng-template ngx-datatable-cell-template let-row="row">
            {{'@'+row.owner?.userName}}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column
          [name]="'::Lead:Account' | abpLocalization"
          prop="AccountId">
          <ng-template ngx-datatable-cell-template let-row="row">
            <a class="text-brand" [routerLink]='["/Accounts",row.account?.id]'>
              {{ row.account?.name }}
            </a>

          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column
        [name]="'::Lead:Phone' | abpLocalization"
        prop="phone">
      </ngx-datatable-column>
        <ngx-datatable-column
          [name]="'::Lead:Email' | abpLocalization"
          prop="email">
        </ngx-datatable-column>

        <ngx-datatable-column
          [name]="'::Lead:Status' | abpLocalization"
          prop="status">
          <ng-template ngx-datatable-cell-template let-row="row">
            {{ row.status | leadstatuspipe | abpLocalization }}
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column
          [name]="'::Lead:Source' | abpLocalization"
          prop="source">
          <ng-template ngx-datatable-cell-template let-row="row">
            {{ row.source | leadsourcepipe | abpLocalization }}
              <!-- {{LeadSource[row.source]}} -->
          </ng-template>
        </ngx-datatable-column>

      </ngx-datatable>
    </div>
  </div>
