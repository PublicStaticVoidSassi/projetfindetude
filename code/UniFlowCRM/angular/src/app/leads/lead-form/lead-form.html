


    <div class="card shadow-sm border-0">
      <div class="card-body px-4">
        <div class="d-flex justify-content-end">
          <app-return-btn></app-return-btn>

        </div>
        <form [formGroup]="form" (ngSubmit)="submit()" class="container">


        <h1 class="Display-6 fw-bold mb-4">

          @if (isUpdate) {

            {{ '::Client:Action:Update' | abpLocalization }}

            <span class="text-brand">
              {{ form.get('firstName')?.value || '' }}
              {{ form.get('lastName')?.value || '' }}

            </span>
            :

          } @else {

            {{ '::Client:Action:Create' | abpLocalization }}

          }

        </h1>

        <div class="row g-3">

          <!-- First Name -->
          <div class="col-md-6">
            <label class="form-label">
              {{ '::Lead:FirstName' | abpLocalization }}
            </label>

            <input
              class="form-control"
              formControlName="firstName"
            />
          </div>

          <!-- Last Name -->
          <div class="col-md-6">
            <label class="form-label">
              {{ '::Lead:LastName' | abpLocalization }}
            </label>

            <input
              class="form-control"
              formControlName="lastName"
            />
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <label class="form-label">
              {{ '::Lead:Email' | abpLocalization }}
            </label>

            <input
              class="form-control"
              formControlName="email"
            />
          </div>

          <!-- Description -->
          <div class="col-12">
            <label class="form-label">
              {{ '::Lead:Description' | abpLocalization }}
            </label>

            <textarea
              class="form-control"
              rows="3"
              formControlName="description">
            </textarea>
          </div>

          <!-- Phone Code -->
          <div class="col-md-2">
            <label class="form-label">
              {{ '::Client:PhoneCode' | abpLocalization }}
            </label>

            <input
              class="form-control"
              formControlName="phoneCode"
              placeholder="+213"
            />
          </div>

          <!-- Phone Number -->
          <div class="col-md-4">
            <label class="form-label">
              {{ '::Client:PhoneNumber' | abpLocalization }}
            </label>

            <input
              class="form-control"
              formControlName="phoneNumber"
            />
          </div>

          <!-- Status -->
          <div class="col">
            <label class="form-label">
              {{ '::Lead:Status' | abpLocalization }}
            </label>

            <select class="form-select" formControlName="status">
                @for (status of leadStatuses; track status.value) {
                  <option [value]="status.value">
                    {{ '::Lead:Status:' + status.value | abpLocalization }}
                  </option>
                }
              </select>
          </div>

          <!-- Source -->

            <div class="col">
              <label class="form-label">
                {{ '::Lead:Source' | abpLocalization }}
              </label>

              <select class="form-select" formControlName="source">

                @for (source of leadSources; track source.value) {

                  <option [value]="source.value">
                    {{ '::Lead:Source:' + source.value | abpLocalization }}
                  </option>

                }

              </select>
            </div>
          @if(form.get("source").value == LeadSource.Campaign){
          <div class="col">
            <campaigns-lookup formControlName="campaignId"></campaigns-lookup>
          </div>
          }
          <!-- Assigned User -->
          <div class="col-md-6">
            <users-lookup formControlName="userID"></users-lookup>
<!--            <label class="form-label">-->
<!--              {{ '::Assignto:Owner' | abpLocalization }}-->
<!--            </label>-->

<!--            <select class="form-select" formControlName="userID">-->

<!--              @for (user of users; track user.id) {-->

<!--                <option [ngValue]="user.id">-->
<!--                  {{ user.userName }}-->
<!--                </option>-->

<!--              }-->

<!--            </select>-->
          </div>

          <!-- Account -->
          <div class="col-md-6">
            <accounts-lookup formControlName="accountID"></accounts-lookup>

          </div>

        </div>

        <!-- Actions -->
        <div class="d-flex justify-content-end gap-2 mt-4">

          <button
            type="button"
            class="btn btn-outline-danger"
            (click)="form.reset()">

            {{ '::Reset' | abpLocalization }}

          </button>

          <button
            type="submit"
            class="btn btn-brand"
            [disabled]="form.invalid">

            {{ '::Save' | abpLocalization }}

          </button>

        </div>



  </form>
      </div>
    </div>
