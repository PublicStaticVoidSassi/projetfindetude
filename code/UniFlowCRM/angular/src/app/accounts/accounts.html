<div class="card">
  <div class="card-header">
    <h1 class="title">{{'::Accounts'|abpLocalization}}</h1>
    </div>
  <div class="card-body">
    <div class="d-flex justify-content-between mb-3">

        <input type="text" class="form-control w-50" (ngModelChange)="search()"  [(ngModel)]="searchName" [placeholder]="'rechercher'"/>

      <button *abpPermission='"UniFlowCRM.Account.Create"' (click)="create()"class="btn btn-brand btn-sm ">
        <i class="fa fa-add"></i>
        {{'::Client:Add' | abpLocalization}}
      </button>
      <!--<div class="col-4">
        <select type="text" class="form-control" (ngModelChange)="search()"  [(ngModel)]="searchType" >
          <option [ngValue]="null">{{"::Account:Type"|abpLocalization}}</option>
          @for(type of accountTypeOptions; track type.value){
              <option [ngValue]="type.value">{{'::Account:Type:'+type.value| abpLocalization}}</option>
          }
        </select>
      </div>
      <div class="col-4">
        <select type="text" class="form-control" (ngModelChange)="search()"  [(ngModel)]="searchIndustry" >
          <option [ngValue]="null">{{"::Account:Industry"|abpLocalization}}</option>

          @for(type of accountIndustryOptions; track type.value){
            <option [ngValue]="type.value">{{'::Account:Industry:'+type.value| abpLocalization}}</option>
          }
        </select>
      </div>-->
    </div>
  <ngx-datatable [rows]="Accounts.items" [count]="Accounts.totalCount" [list]="List" default>
    <ngx-datatable-column   [sortable]="false">
      <ng-template ngx-datatable-cell-template let-row="row">
        <div ngbDropdown container="body" class="d-inline-block">
          <button
            class="btn btn-brand btn-sm dropdown-toggle"
            data-toggle="dropdown"
            aria-haspopup="true"
            ngbDropdownToggle
          >
            <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
          </button>
          <div ngbDropdownMenu>
            <button ngbDropdownItem class="btn 5" (click)="openDetails(row.id)">
              <i class="fa fa-plus-circle p-1   rounded-5"></i>
              {{ '::Action:Info' | abpLocalization }}
            </button>
            <button ngbDropdownItem class="btn" *abpPermission='"UniFlowCRM.Account.Delete"' (click)="delete(row.id)">
              <i class="fa fa-trash p-1  rounded-5"></i>
              {{ '::Action:Delete' | abpLocalization }}
            </button>
            <button ngbDropdownItem class="btn" *abpPermission='"UniFlowCRM.Lead.Edit"' (click)="edit(row.id)">
              <i class="fa fa-pen p-1  rounded-5"></i>
              {{ '::Action:Edit' | abpLocalization }}            </button>
          </div>
        </div>
<!--        -->

      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column
      [name]="'::Client:Name' | abpLocalization"
      prop="name">
    </ngx-datatable-column>

<!--    <ngx-datatable-column-->
<!--      [name]="'::Client:Description' | abpLocalization"-->
<!--      prop="description">-->
<!--    </ngx-datatable-column>-->

    <ngx-datatable-column
      [name]="'::Client:Phone' | abpLocalization"
      prop="phone">
    </ngx-datatable-column>

<!--    <ngx-datatable-column-->
<!--      [name]="'::Client:Fax' | abpLocalization"-->
<!--      prop="fax">-->
<!--    </ngx-datatable-column>-->

    <ngx-datatable-column
      [name]="'::Client:Email' | abpLocalization"
      prop="email" minWidth="200">
    </ngx-datatable-column>
    <ngx-datatable-column
      [name]="'::Client:AssignedTo' | abpLocalization"
      prop="UserID" minWidth="200">
      <ng-template ngx-datatable-cell-template let-row="row">
        {{'@'+row.owner?.userName}}
      </ng-template>
    </ngx-datatable-column>
<!--    <ngx-datatable-column-->
<!--      [name]="'::Client:Website' | abpLocalization"-->
<!--      prop="website">-->
<!--    </ngx-datatable-column>-->

<!--    <ngx-datatable-column-->
<!--      [name]="'::Client:City' | abpLocalization"-->
<!--      prop="city">-->
<!--    </ngx-datatable-column>-->

    <ngx-datatable-column
      [name]="'::Client:Street' | abpLocalization"
      prop="address.street">
    </ngx-datatable-column>

<!--    <ngx-datatable-column-->
<!--      [name]="'::Client:Country' | abpLocalization"-->
<!--      prop="country">-->
<!--    </ngx-datatable-column>-->

<!--    <ngx-datatable-column-->
<!--      [name]="'::Client:PostalCode' | abpLocalization"-->
<!--      prop="postalCode">-->
<!--    </ngx-datatable-column>-->

    <ngx-datatable-column
      [name]="'::Account:Type' | abpLocalization" prop="type"
    >
      <ng-template ngx-datatable-cell-template let-row="row">
        {{"::Account:Type:"+row.type | abpLocalization}}
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column
      [name]="'::Account:Industry' | abpLocalization" prop="industry"
    >
      <ng-template ngx-datatable-cell-template let-row="row">
        {{"::Account:Industry:"+row.industry | abpLocalization}}
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column
      [name]="'::Account:Revenue' | abpLocalization" prop="Revenue.Value">

      <ng-template ngx-datatable-cell-template let-row="row">
        @if(!!row.revenueValue){{{ row.revenueValue | mycurrency: row.revenueCurrency }}}
      </ng-template>

    </ngx-datatable-column>

    <ngx-datatable-column
      [name]="'::Account:Employees' | abpLocalization"
      prop="employees">
    </ngx-datatable-column>

<!--    <ngx-datatable-column-->
<!--      [name]="'::Client:UserID' | abpLocalization"-->
<!--      prop="userID">-->
<!--    </ngx-datatable-column>-->
  </ngx-datatable>
</div>
</div>
