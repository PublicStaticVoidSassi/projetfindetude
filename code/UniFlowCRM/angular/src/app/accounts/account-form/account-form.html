<form [formGroup]="form" (ngSubmit)="submit()" class="container">

  <div class="card shadow-sm border-0">
    <div class="card-body px-4">
      <app-return-btn></app-return-btn>

      <!-- Header -->
      <h1 class="Display-6 fw-bold mb-4">

        @if (isUpdate) {
          {{ '::Account:Action:Update' | abpLocalization }}
          <span class="text-primary">
            {{ form.get('name')?.value || '' }}
          </span>
        } @else {
          {{ '::Account:Action:Create' | abpLocalization }}
        }

      </h1>

      <div class="row g-3">

        <!-- Name -->
        <div class="col-md-6">
          <label class="form-label">
            {{ '::Account:Name' | abpLocalization }}
          </label>
          <input class="form-control"
                 formControlName="name"
                 [placeholder]="'::Account:Name:Placeholder' | abpLocalization" />
        </div>

        <!-- Email -->
        <div class="col-md-6">
          <label class="form-label">
            {{ '::Account:Email' | abpLocalization }}
          </label>
          <input class="form-control"
                 formControlName="email"
                 [placeholder]="'::Account:Email:Placeholder' | abpLocalization" />
        </div>

        <!-- Description -->
        <div class="col-12">
          <label class="form-label">
            {{ '::Account:Description' | abpLocalization }}
          </label>
          <textarea class="form-control"
                    rows="3"
                    formControlName="description"
                    [placeholder]="'::Account:Description:Placeholder' | abpLocalization"></textarea>
        </div>

        <!-- Phone -->
        <div class="col-md-3">
          <label class="form-label">{{ '::Account:PhoneCode' | abpLocalization }}</label>
          <input class="form-control"
                 formControlName="phoneCode"
                 placeholder="+1" />
        </div>

        <div class="col-md-3">
          <label class="form-label">{{ '::Account:PhoneNumber' | abpLocalization }}</label>
          <input class="form-control"
                 formControlName="phoneNumber"
                 [placeholder]="'::Account:PhoneNumber:Placeholder' | abpLocalization" />
        </div>

        <!-- Fax -->
        <div class="col-md-3">
          <label class="form-label">{{ '::Account:FaxCode' | abpLocalization }}</label>
          <input class="form-control" formControlName="faxCode" />
        </div>

        <div class="col-md-3">
          <label class="form-label">{{ '::Account:FaxNumber' | abpLocalization }}</label>
          <input class="form-control" formControlName="faxNumber" />
        </div>

        <!-- Website -->
        <div class="col-md-6">
          <label class="form-label">{{ '::Account:Website' | abpLocalization }}</label>
          <input class="form-control"
                 formControlName="website"
                 placeholder="https://example.com" />
        </div>

        <!-- Country -->
        <div class="col-md-6">
          <label class="form-label">{{ '::Account:Country' | abpLocalization }}</label>
          <input class="form-control" formControlName="country" />
        </div>

        <!-- Street -->
        <div class="col-md-6">
          <label class="form-label">{{ '::Account:Street' | abpLocalization }}</label>
          <input class="form-control" formControlName="street" />
        </div>

        <!-- City -->
        <div class="col-md-3">
          <label class="form-label">{{ '::Account:City' | abpLocalization }}</label>
          <input class="form-control" formControlName="city" />
        </div>

        <!-- Postal -->
        <div class="col-md-3">
          <label class="form-label">{{ '::Account:PostalCode' | abpLocalization }}</label>
          <input class="form-control" type="number" formControlName="postalCode" />
        </div>

        <!-- Type -->
        <div class="col-md-4">
          <label class="form-label">{{ '::Account:Type' | abpLocalization }}</label>
          <select class="form-select" formControlName="type">
            @for (type of accountTypes; track type) {
              <option [NgValue]="type">
                {{ '::' + type | abpLocalization }}
              </option>
            }
          </select>
        </div>

        <!-- Industry -->
        <div class="col-md-4">
          <label class="form-label">{{ '::Account:Industry' | abpLocalization }}</label>
          <select class="form-select" formControlName="industry">
            @for (industry of accountIndustries; track industry) {
              <option [ngValue]="industry">
                {{ '::' + industry | abpLocalization }}
              </option>
            }
          </select>
        </div>

        <!-- Employees -->
        <div class="col-md-4">
          <label class="form-label">{{ '::Account:Employees' | abpLocalization }}</label>
          <input class="form-control" type="number" formControlName="employees" />
        </div>

        <!-- Revenue -->
        <div class="col-md-6">
          <label class="form-label">{{ '::Account:RevenueAmount' | abpLocalization }}</label>
          <input class="form-control" type="number" formControlName="revenueAmount" />
        </div>

        <!-- Currency -->
        <div class="col-md-6">
          <label class="form-label">{{ '::Account:RevenueCurrency' | abpLocalization }}</label>
          <select class="form-select" formControlName="revenueCurrency">
            @for (currency of currencies; track currency) {
              <option [ngValue]="currency">
                {{ currency }}
              </option>
            }
          </select>
        </div>

        <!-- Assign -->
        <div class="col-md-6">
          <label class="form-label">{{ '::Account:AssignTo' | abpLocalization }}</label>
          <select class="form-select" formControlName="userID">
            @for (user of users; track user.id) {
              <option [ngValue]="user.id">
                {{ user.userName }}
              </option>
            }
          </select>
        </div>

      </div>

      <!-- Actions -->
      <div class="d-flex justify-content-end gap-2 mt-4">

        <button type="button"
                class="btn btn-outline-secondary"
                (click)="form.reset()">
          {{ '::Reset' | abpLocalization }}
        </button>

        <button type="submit"
                class="btn btn-primary"
                [disabled]="form.invalid">
          {{ '::Save' | abpLocalization }}
        </button>

      </div>

    </div>
  </div>

</form>
